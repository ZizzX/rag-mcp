# Optional: Qdrant as a server instead of the embedded store.
# Use it when the corpus is large or several processes must share one index.
#   docker compose up -d
#   echo RAG_QDRANT_URL=http://localhost:6333 >> .env
services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_storage:
