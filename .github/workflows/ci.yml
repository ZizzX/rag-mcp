name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Everything in CI runs offline: no Ollama, no Claude CLI, no network embeddings.
  RAG_EMBED_PROVIDER: hash
  RAG_DOCS_DIR: examples/docs

jobs:
  test:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install (same path a user takes, minus Ollama and Claude Code)
        if: runner.os != 'Windows'
        run: ./install.sh --no-ollama --no-claude

      - name: Install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\install.ps1 -NoOllama -NoClaude

      - name: Unit tests
        run: uv run --extra dev pytest -q

      - name: Smoke test the CLI end to end
        shell: bash
        run: |
          set -euo pipefail
          export RAG_INDEX_DIR="$RUNNER_TEMP/rag-index"
          # `expect <pattern> <cmd...>` prints the command output and fails unless it matches.
          # (No `tee /dev/stderr`: Git Bash on Windows has no /dev/stderr.)
          expect() { local pat="$1"; shift; local out; out="$("$@")"; printf '%s\n' "$out"; grep -q -- "$pat" <<<"$out"; }
          uv run rag-mcp ingest
          expect "unchanged=3" uv run rag-mcp ingest
          expect "onboarding.md" uv run rag-mcp search "how long is the VPN certificate valid" -k 1
          uv run rag-mcp status
          expect '"hit_rate": 1.0' uv run rag-mcp eval eval/questions.example.jsonl -k 3

      - name: Smoke test the MCP server over stdio
        shell: bash
        run: |
          export RAG_INDEX_DIR="$RUNNER_TEMP/rag-index"
          uv run python - <<'PY'
          import asyncio, json, os, sys
          from mcp import ClientSession, StdioServerParameters
          from mcp.client.stdio import stdio_client

          async def main():
              exe = "rag-mcp.exe" if sys.platform == "win32" else "rag-mcp"
              bindir = "Scripts" if sys.platform == "win32" else "bin"
              params = StdioServerParameters(command=os.path.join(".venv", bindir, exe), args=["serve"], env=dict(os.environ))
              async with stdio_client(params) as (r, w):
                  async with ClientSession(r, w) as s:
                      await s.initialize()
                      names = sorted(t.name for t in (await s.list_tools()).tools)
                      assert names == ["fetch_document", "index_status", "list_sources", "reindex", "search"], names
                      res = await s.call_tool("search", {"query": "phishing email", "top_k": 1})
                      out = json.loads(res.content[0].text)
                      assert out["scope"]["mode"] == "all", out["scope"]
                      hit = out["results"][0]
                      assert hit["source"] == "security-policy.pdf", hit
                      print("MCP ok:", names, "->", hit["source"], "p.", hit["page"])
          asyncio.run(main())
          PY
