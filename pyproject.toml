[project]
name = "rag-mcp"
version = "0.1.0"
description = "Local RAG over Markdown and PDF, exposed as an MCP server (hybrid search: dense vectors + BM25)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.10",
    "numpy>=1.26",
    "qdrant-client>=1.12",
    "pymupdf>=1.24",
    "rank-bm25>=0.2.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rag-mcp = "rag_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
